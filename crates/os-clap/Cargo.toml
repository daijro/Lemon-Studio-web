[package]
name = "os-clap"
description = "Lemon Studio's CLAP plugin host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
clap-sys = "0.5"
os-engine.workspace = true
os-host.workspace = true
os-hostlink.workspace = true


[dev-dependencies]
os-model.workspace = true
# The built-in EQ, linked (no exported entry points), for the parameter tests.
lemon-parametric-eq-2 = { path = "../../plugins/lemon-parametric-eq-2", features = ["linked"] }
# The built-in Lemon Sampler, linked, for the portamento test.
lemon-sampler = { path = "../../plugins/lemon-sampler", features = ["linked"] }
# The built-in Lemon Trio and Citrus, linked, for the note mods test.
lemon-3x-osc = { path = "../../plugins/lemon-3x-osc", features = ["linked"] }
citrus = { path = "../../plugins/citrus", features = ["linked"] }
# The built-in Lemon Limiter, linked: a plugin with a sidechain input port.
lemon-limiter = { path = "../../plugins/lemon-limiter", features = ["linked"] }
# The built-in Lemon Peak Controller, linked: controller outputs as MIDI.
lemon-peak-controller = { path = "../../plugins/lemon-peak-controller", features = ["linked"] }
# The built-in Lemon Formula Controller, linked: a controller output worked out from the song position.
lemon-formula-controller = { path = "../../plugins/lemon-formula-controller", features = ["linked"] }
lemon-small-fx = { path = "../../plugins/lemon-small-fx" }

serde_json = "1"
os-paths.workspace = true
os-dsp.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
wasm_thread = "=0.3.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"

[[example]]
name = "builtin_probe_web"
path = "examples/builtin_probe_web.rs"
crate-type = ["cdylib"]
