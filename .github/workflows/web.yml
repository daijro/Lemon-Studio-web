name: Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Native fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Install web tooling
        run: tools/web-setup.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Build fixtures and app with test observations
        run: |
          node crates/os-app/web/files.test.mjs
          tools/web-fixtures.sh
          tools/web-build.sh --features web-test
      - name: Chromium
        run: node tools/web-check.mjs all
      - name: Firefox
        run: WEB_BROWSER=firefox node tools/web-check.mjs all
      - name: Package production app
        run: |
          tools/web-build.sh
          node tools/web-check.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: lemon-studio-web
          path: dist/lemon-studio-web.zip

      - name: Publish web release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TAG: v0.0.1-web.${{ github.run_number }}
        run: |
          if gh release view "$WEB_TAG" >/dev/null 2>&1; then
            gh release upload "$WEB_TAG" dist/lemon-studio-web.zip --clobber
          else
            gh release create "$WEB_TAG" dist/lemon-studio-web.zip \
              --target "$GITHUB_SHA" --title "Lemon Studio $WEB_TAG" \
              --prerelease --notes-file web/RELEASE.md
          fi
